<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stochastik">

<title>Stochastik-Werkstatt</title>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<style>
/* Layout: Werkbank – links Kartenregister, Mitte Szene, rechts Steuerpult der gewählten Karte; schmal: untereinander */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --stage:#F8FAF7; --ink:#15202A; --muted:#5A6771; --line:#D3DAD4;
  --va:#E0590B; --vb:#1971C2; --vr:#2B8A3E; --vc:#9C36B5; --hit:#E03131;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1519; --surface:#172028; --stage:#0C1216; --ink:#E4EBEE; --muted:#93A1AB; --line:#2A3641;
  --va:#FF8A3D; --vb:#4DABF7; --vr:#51CF66; --vc:#DA77F2; --hit:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172028; --stage:#0C1216; --ink:#E4EBEE; --muted:#93A1AB; --line:#2A3641;
  --va:#FF8A3D; --vb:#4DABF7; --vr:#51CF66; --vc:#DA77F2; --hit:#FF6B6B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 24px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.88rem}
main{display:grid;grid-template-columns:200px minmax(0,1fr) 380px;gap:12px;align-items:start}
nav{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
nav .grp{display:flex;flex-direction:column;gap:2px}
nav .gl{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:2px 6px}
nav button{font:inherit;font-size:.86rem;text-align:left;border:0;background:transparent;color:var(--ink);padding:5px 8px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
nav button b{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--muted);min-width:1.6em}
nav button:hover{background:var(--bg)}
nav button[aria-current="true"]{background:var(--ink);color:var(--surface)}
nav button[aria-current="true"] b{color:var(--surface)}
button:focus-visible,input:focus-visible{outline:2px solid var(--vb);outline-offset:2px}
.stage{position:relative;aspect-ratio:900/560;max-height:76vh;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:100%}
.mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.hint{font-size:.78rem;color:var(--muted);padding-inline:4px;min-height:1.2em}
.panels{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:13px;min-width:0}
.ph .kn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.ph h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.q{margin:0;font-size:1rem;font-weight:500}
.q span{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.ca{color:var(--va)} .cb{color:var(--vb)} .cr{color:var(--vr)} .cc{color:var(--vc)} .ch{color:var(--hit)}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.84rem;padding:10px;border-radius:8px;background:var(--bg);overflow-x:auto;line-height:1.6}
.eq.col{flex-direction:column;align-items:flex-start;gap:4px}
.eq .m{color:var(--muted)}
.eq sub,.eq sup{font-size:.72em}
.cond{display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;background:color-mix(in srgb,var(--vb) 18%,transparent);border-left:3px solid var(--vb);border-radius:6px;padding:3px 9px;font-weight:600;font-family:var(--f-mono);font-size:.82rem;line-height:1.5}
.cond i{font-style:normal;font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--vb);font-weight:700;font-family:var(--f-body)}
.cond.ok{background:color-mix(in srgb,var(--vr) 18%,transparent);border-color:var(--vr)} .cond.ok i{color:var(--vr)}
.cond.bad{background:color-mix(in srgb,var(--hit) 18%,transparent);border-color:var(--hit)} .cond.bad i{color:var(--hit)}
.steps .cond{font-size:.78rem}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:.86rem}
.sl output{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%}
input[type=range]{accent-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;font-size:.86rem;border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.chk input{margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);font-weight:600}
.lbl{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.status{font-size:.88rem;padding:10px 12px;border-radius:8px;border-left:4px solid var(--muted);background:var(--bg)}
.status.ok{border-color:var(--vr)} .status.bad{border-color:var(--hit)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.steps li{opacity:.4}
.steps li.on{opacity:1}
.steps li.cur{opacity:1;font-weight:600}
.steps .m{font-family:var(--f-mono);font-size:.82rem;font-weight:400}
.note{font-size:.82rem;color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.tscroll{overflow-x:auto;max-width:100%}
.dist{border-collapse:collapse;font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums}
.dist th,.dist td{padding:3px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dist th{font-weight:600;color:var(--muted)}
.dist th:first-child,.dist td:first-child{text-align:left}
.dist tr.foot td{font-weight:600;border-top:2px solid var(--ink)}
.dist.wrap1 td:first-child{white-space:normal;max-width:9em;line-height:1.3}
.dist .h1{background:color-mix(in srgb,var(--va) 28%,transparent)}
.dist tr.h1 td,.dist tr.h1 th{background:color-mix(in srgb,var(--va) 22%,transparent);font-weight:600;color:var(--ink)}
.kw{width:100%;border-collapse:collapse;font-size:.86rem}
.kw td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.kw td:last-child{text-align:right;white-space:nowrap}
.kw button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
.frames{display:flex;flex-direction:column;gap:6px}
.frames button{font:inherit;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.frames button b{font-size:.88rem} .frames button span{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.frames button[data-state="ok"]{border-color:var(--vr);background:color-mix(in srgb,var(--vr) 16%,transparent)}
.frames button[data-state="bad"]{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 14%,transparent)}
.ttext{font-size:.92rem;line-height:1.9}
.tok{font:inherit;font-size:.9rem;border:1px dashed var(--muted);background:transparent;color:var(--ink);border-radius:5px;padding:0 5px;cursor:pointer;line-height:1.5}
.tok:hover{border-color:var(--ink);background:var(--bg)} .tok.used{border-style:solid;border-color:var(--va);background:color-mix(in srgb,var(--va) 22%,transparent);font-weight:600}
.tok.wrongtok{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 18%,transparent)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font:inherit;font-family:var(--f-mono);font-size:.84rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer}
.slot.active{border-color:var(--vb);box-shadow:0 0 0 3px color-mix(in srgb,var(--vb) 30%,transparent)}
.slot.ok{border-color:var(--vr);background:color-mix(in srgb,var(--vr) 16%,transparent)} .slot.bad{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 16%,transparent)}
.slot i{font-style:normal;color:var(--muted)}
.fslot{fill:var(--bg);stroke:var(--line);stroke-width:2} .fslot.ok{stroke:var(--vr)} .fslot.bad{stroke:var(--hit)} .fslot.active{stroke:var(--vb);stroke-width:3}
.dl{display:flex;flex-direction:column;gap:6px}
.dlitem{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-decoration:none}
.dlitem:hover{border-color:var(--ink)}
.dlitem b{font-size:.9rem} .dlitem span{font-size:.78rem;color:var(--muted)}
.err{display:none;background:var(--hit);color:#fff;padding:8px 12px;border-radius:8px;font-size:.85rem}

/* SVG-Szene */
.t{fill:var(--ink);font-family:var(--f-body);font-size:14px}
.t.m{fill:var(--muted)} .t.mono{font-family:var(--f-mono)} .t.b{font-weight:600} .t.nl{fill:#fff;font-weight:600}
.t.ca{fill:var(--va)} .t.ch{fill:var(--hit)}
.ax{stroke:var(--ink);stroke-width:1.2;fill:none} .grid{stroke:var(--line);stroke-width:1}
.bar{fill:var(--vb)} .bar.on{fill:var(--va)} .bar.dim{fill:var(--line)} .bar.lt{fill:var(--vb)} .bar.gt{fill:var(--vr)} .bar.pick{cursor:pointer}
.mu{stroke:var(--hit);stroke-width:2;stroke-dasharray:6 4;fill:none} .band{fill:var(--va);opacity:.14} .bnd{stroke:var(--va);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.edge{stroke:var(--ink);stroke-width:2;fill:none} .edge.dim{opacity:.22} .edge.on{stroke:var(--va);stroke-width:5}
.nd{stroke:var(--surface);stroke-width:2} .nd.R{fill:var(--va)} .nd.B{fill:var(--vb)} .nd.root{fill:var(--ink)}
.chip{fill:var(--line)} .chip.T{fill:var(--va)}
.urn{fill:var(--surface);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ball{stroke:var(--surface);stroke-width:1.5} .ball.R{fill:var(--va)} .ball.B{fill:var(--vb)} .ball.out{fill:none;stroke:var(--muted);stroke-dasharray:3 2}
.task{font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--vb);line-height:1.6}
mark.kw{position:relative;background:color-mix(in srgb,var(--va) 22%,transparent);color:inherit;border-bottom:2px solid var(--va);border-radius:3px;padding:0 2px;cursor:help;outline:none}
mark.kw:hover,mark.kw:focus{background:color-mix(in srgb,var(--va) 40%,transparent)}
mark.kw:hover::after,mark.kw:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 4px);z-index:20;background:var(--ink);color:var(--surface);padding:7px 9px;border-radius:7px;font-size:.78rem;font-weight:400;line-height:1.4;width:max-content;max-width:280px;white-space:normal;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.kwtg{display:block;margin-top:8px;font:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
.kwlist{margin:8px 0 0;padding-left:1.1em;font-size:.82rem;display:flex;flex-direction:column;gap:5px}
.kwlist b{color:var(--va)} .kwlist b.neg{color:var(--hit)} .kwlist li.m{color:var(--muted);list-style:none;margin-left:-1.1em;font-size:.76rem}
mark.kw.neg{background:color-mix(in srgb,var(--hit) 24%,transparent);border-bottom-color:var(--hit);font-weight:700}
mark.kw.neg:hover,mark.kw.neg:focus{background:color-mix(in srgb,var(--hit) 42%,transparent)}
.colbg{fill:var(--va);opacity:.12}
@media (max-width:1180px){main{grid-template-columns:minmax(0,1fr) 360px}nav{grid-column:1/-1;flex-direction:row;overflow-x:auto;padding:8px}nav .grp{flex-direction:row;align-items:center;flex:none}nav button{white-space:nowrap}}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.mid{display:contents}.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;aspect-ratio:auto;height:clamp(240px,42vh,420px);box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}.hint{display:none}}
</style>

<div class="wrap">
<header>
  <h1>Stochastik-Werkstatt</h1>
  <p>Zu jeder Rezeptkarte eine Szene zum Schieben, Umschalten und Abspielen</p>
</header>
<div class="err" id="err"></div>
<main>
  <nav id="nav" aria-label="Rezeptkarten"></nav>
  <div class="mid">
    <div class="stage" id="stage">
      <svg id="svg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Szene"></svg>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="panels" id="panels"></div>
</main>
</div>

<script>
window.addEventListener('error', e => { const b = document.getElementById('err'); if (b) { b.style.display = 'block'; b.textContent = 'Fehler in der App: ' + e.message; } });
</script>
<script>
(function(){
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

// ---------- Zahlen & Formate ----------
const fmt = (x,d=2) => { if (!isFinite(x)) return '–'; if (Math.abs(x) < 5e-7) x = 0; return (+x.toFixed(d)).toString().replace('-','−').replace('.',','); };
const fix = (x,d=4) => isFinite(x) ? x.toFixed(d).replace('-','−').replace('.',',') : '–';
const pct = (x,d=1) => fmt(100*x,d) + ' %';
const eur = x => fmt(x,2) + ' €';
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const frac = (n,d) => { if (n === 0) return '0'; const g = gcd(n,d); n /= g; d /= g; return d === 1 ? String(n) : n + '/' + d; };
const sum = a => a.reduce((s,x) => s + x, 0);
const range = (a,b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => SUP[+c]).join('');
const Fs = (n,p) => `F<sub>${n};${fmt(p,2)}</sub>`;
const Bs = (n,p) => `B<sub>${n};${fmt(p,2)}</sub>`;

// Binomialverteilung: Einzelwahrscheinlichkeiten rekursiv, kumuliert als Summe
function binom(n,p){
  const q = 1 - p, a = new Array(n+1).fill(0);
  if (p <= 0) { a[0] = 1; return a; } if (p >= 1) { a[n] = 1; return a; }
  let v = Math.pow(q, n); a[0] = v;
  for (let k = 0; k < n; k++) { v = v * (n-k) / (k+1) * p / q; a[k+1] = v; }
  return a;
}
function cdf(a){ const c = []; let s = 0; for (const x of a) { s += x; c.push(Math.min(1,s)); } return c; }
const cF = (c,k) => k < 0 ? 0 : (k >= c.length ? 1 : c[k]);
const pRange = (c,a,b) => a > b ? 0 : Math.max(0, cF(c,b) - cF(c,a-1));
function choose(n,k){ if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n-k+i) / i; return Math.round(r); }
const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };

// ---------- SVG-Bausteine ----------
const NS = 'http://www.w3.org/2000/svg', svg = $('svg');
function el(tag, attrs, ...kids){ const e = document.createElementNS(NS, tag); for (const k in (attrs||{})) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); } for (const c of kids) e.append(typeof c === 'string' ? document.createTextNode(c) : c); return e; }
function T(x,y,s,cls='t',anchor='middle',size,fill){ const a = {x,y,class:cls,'text-anchor':anchor,'dominant-baseline':'middle'}; if (size || fill) a.style = (size ? `font-size:${size}px;` : '') + (fill ? `fill:var(${fill})` : ''); return el('text', a, s); }
function clear(){ svg.replaceChildren(); }
const PL = {L:72, R:872, T:40, B:488};
function niceTicks(ymax){ const raw = ymax/5, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p, s = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; const out = []; for (let v = 0; v <= ymax + 1e-9; v += s) out.push(v); return {ticks: out, dec: Math.max(0, -Math.floor(Math.log10(s)))}; }
// Säulendiagramm über k = 0..n. o: {n, arr, cls(k), ymax, ylabel, pick}
function hist(o){
  const {n, arr} = o, W = PL.R - PL.L, w = W / (n+1), bw = Math.max(2, w * 0.76);
  const ymax = o.ymax || (Math.max(...arr) * 1.12) || 1;
  const y = v => PL.B - (v/ymax) * (PL.B - PL.T), x = k => PL.L + (k+0.5) * w, xv = v => PL.L + (v+0.5) * w;
  const g = el('g'); const tk = niceTicks(ymax);
  for (const v of tk.ticks) { g.append(el('line', {x1:PL.L, x2:PL.R, y1:y(v), y2:y(v), class:'grid'})); g.append(T(PL.L-8, y(v), fmt(v, tk.dec), 't m mono', 'end', 12)); }
  g.append(el('line', {x1:PL.L, x2:PL.R, y1:PL.B, y2:PL.B, class:'ax'}));
  const step = n <= 20 ? 1 : n <= 50 ? 5 : n <= 120 ? 10 : 20;
  for (let k = 0; k <= n; k++) {
    const c = o.cls ? o.cls(k) : '', h = Math.max(0, PL.B - y(arr[k]));
    g.append(el('rect', {x:x(k)-bw/2, y:PL.B-h, width:bw, height:h, rx:Math.min(3, bw/3), class:'bar ' + c + (o.pick ? ' pick' : ''), 'data-k':k}));
    if (k % step === 0) g.append(T(x(k), PL.B+16, String(k), 't m mono', 'middle', 12));
  }
  g.append(T(PL.R+12, PL.B+16, 'k', 't m'));
  g.append(T(PL.L-8, PL.T-18, o.ylabel || 'P(X = k)', 't m', 'end', 12));
  svg.append(g);
  return {x, y, w, xv, ymax};
}
// μ-Linie und Umgebung μ ± zσ, ganzzahlig nach innen gerundet [a; b]
function drawBand(H, mu, sd, z, a, b, label, tails){
  const x1 = H.xv(mu - z*sd), x2 = H.xv(mu + z*sd);
  svg.append(el('rect', {x:x1, y:PL.T, width:Math.max(0,x2-x1), height:PL.B-PL.T, class:'band'}));
  [x1, x2].forEach(x => svg.append(el('line', {x1:x, x2:x, y1:PL.T, y2:PL.B, class:'bnd'})));
  svg.append(el('line', {x1:H.xv(mu), x2:H.xv(mu), y1:PL.T-6, y2:PL.B, class:'mu'}));
  svg.append(T(H.xv(mu), PL.T-18, `μ = ${fmt(mu,2)}`, 't b ch'));
  svg.append(T(x1-5, PL.T+12, `μ − ${z}σ = ${fmt(mu-z*sd,2)}`, 't mono ca', 'end', 12));
  svg.append(T(x2+5, PL.T+12, `μ + ${z}σ = ${fmt(mu+z*sd,2)}`, 't mono ca', 'start', 12));
  // Klammer unter der Achse: die nach innen gerundete Umgebung a … b
  bracket(H.x(a) - H.w*0.4, H.x(b) + H.w*0.4, PL.B+28, label, '--va');
  if (tails) { const ty = PL.T + 32;
    svg.append(T((x1+x2)/2, ty, `innen ${pct(tails.inside,1)}`, 't b ca', 'middle', 15));
    if (x1 - PL.L > 150 && a > 0) svg.append(T((PL.L+x1)/2, ty, `links: P(X ≤ ${a-1}) = ${pct(tails.left,1)}`, 't m', 'middle', 12));
    if (PL.R - x2 > 150 && tails.right > 0) svg.append(T((x2+PL.R)/2, ty, `rechts: P(X ≥ ${b+1}) = ${pct(tails.right,1)}`, 't m', 'middle', 12));

}
// Waagerechte Klammer mit Beschriftung darunter
function bracket(x1, x2, y, label, col, dy=15, up=false){
  const arm = up ? 7 : -7;
  svg.append(el('path', {d:`M ${x1} ${y+arm} L ${x1} ${y} L ${x2} ${y} L ${x2} ${y+arm}`, style:`fill:none;stroke:var(${col});stroke-width:2`}));
  svg.append(T((x1+x2)/2, up ? y-12 : y+dy, label, 't b', 'middle', 13, col));
}

// Urne mit Kugeln: r rote, b blaue; gone = Farbe der gerade entnommenen Kugel (als leerer Platz gezeigt)
function drawUrn(cx, cy, w, h, r, b, gone){
  const g = el('g');
  const top = cy - h/2, bot = cy + h/2, xl = cx - w/2, xr = cx + w/2, ins = w * 0.08;
  g.append(el('path', {d:`M ${xl} ${top} L ${xl+ins} ${bot-8} Q ${cx} ${bot+10} ${xr-ins} ${bot-8} L ${xr} ${top}`, class:'urn'}));
  g.append(el('line', {x1:xl-6, x2:xr+6, y1:top, y2:top, class:'urn'}));
  const balls = [...Array(r).fill('R'), ...Array(b).fill('B')]; if (gone) balls.push('out' + gone);
  const n = balls.length, cols = Math.min(4, n), rows = Math.ceil(n / cols);
  const rad = Math.max(4, Math.min((w - 2*ins - 12) / (cols*2.3), (h - 14) / (rows*2.3)));
  balls.forEach((c, i) => { const row = Math.floor(i / cols), col = i % cols, inRow = Math.min(cols, n - row*cols);
    const x = cx + (col - (inRow-1)/2) * rad*2.3, y = bot - 10 - rad - row * rad*2.2;
    const cls = c.startsWith('out') ? 'ball out' : 'ball ' + c;
    g.append(el('circle', {cx:x, cy:y, r:rad, class:cls})); });
  svg.append(g);
}

// Ergebniskorb: die gezogenen Kugeln eines Pfads, z. B. ['R','B']
function drawBasket(cx, cy, colors, on, handle=true){
  const g = el('g', {opacity: on ? 1 : 0.4}), hw = 10 + 10*colors.length;
  g.append(el('path', {d:`M ${cx-hw} ${cy-13} L ${cx-hw+6} ${cy+12} Q ${cx} ${cy+19} ${cx+hw-6} ${cy+12} L ${cx+hw} ${cy-13}`, class:'urn'}));
  g.append(el('line', {x1:cx-hw-4, x2:cx+hw+4, y1:cy-13, y2:cy-13, class:'urn'}));
  if (handle) g.append(el('path', {d:`M ${cx-14} ${cy-13} Q ${cx} ${cy-34} ${cx+14} ${cy-13}`, class:'urn', style:'fill:none'}));
  colors.forEach((c,i) => g.append(el('circle', {cx:cx + (i - (colors.length-1)/2) * 19, cy:cy+1, r:8.5, class:'ball ' + c})));
  svg.append(g);
}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const kwOpen = new Set();
function hlText(seg){
  const found = [];
  KWS.forEach(([re,tip,cls]) => { const g = new RegExp(re.source, 'g'); let m; while ((m = g.exec(seg))) { if (!m[0]) { g.lastIndex++; continue; } found.push({s:m.index, e:m.index+m[0].length, tip, txt:m[0], cls:cls || ''}); } });
  found.sort((a,b) => a.s - b.s || b.e - a.e);
  let out = '', pos = 0;
  for (const f of found) { if (f.s < pos) continue; out += seg.slice(pos, f.s) + `<mark class="kw ${f.cls}" tabindex="0" data-tip="${esc(f.tip)}">${f.txt}</mark>`; pos = f.e; }
  return out + seg.slice(pos);
}

  const open = kwOpen.has(id);
  return `<b>Aufgabe:</b> ${out}` + (list.length ? `<button class="kwtg" type="button" data-box="${id}">${open ? 'Erklärungen ausblenden' : `Schlüsselwörter erklären (${list.length})`}</button><ul class="kwlist"${open ? '' : ' hidden'}>${list.map(([w,t,c]) => `<li><b class="${c.includes('neg') ? 'neg' : ''}">${w}</b> – ${t}</li>`).join('')}<li class="m">Rot = Umkehrwort (dreht die Aufgabe), orange = Fachbegriff.</li></ul>` : '');
}

  `<div class="eq col" id="k1eq"></div>` + UI.st('k1st') + UI.leg([['--va','rot (R)'],['--vb','blau (B)']]),
 init(){ const S = this; S.r = 3; S.b = 2; S.mode = 0; S.ev = 0; S.wrong = false; S.lit = null;
  onSl('k1r', v => { S.r = v; S.lit = null; S.upd(); }); onSl('k1b', v => { S.b = v; S.lit = null; S.upd(); });
  onSeg('k1K', i => S.preset(K1P[i])); $('k1KR').addEventListener('click', () => S.preset({r:1+rnd(6), b:1+rnd(6), mode:rnd(2), ev:rnd(EVN.length)}));
  onSeg('k1mode', v => { S.mode = v; S.lit = null; S.upd(); }); onSeg('k1ev', v => { S.ev = v; S.lit = null; S.upd(); });

 },
 show(){ this.lit = null; this.upd(); },
 paths(wrong){
  const S = this, N = S.r + S.b, same = S.mode === 1 || wrong;
  const p1 = {R:[S.r,N], B:[S.b,N]};
  const p2 = a => same ? p1 : (a === 'R' ? {R:[S.r-1,N-1], B:[S.b,N-1]} : {R:[S.r,N-1], B:[S.b-1,N-1]});
  const out = [];
  for (const a of 'RB') for (const c of 'RB') { const f1 = p1[a], f2 = p2(a)[c]; out.push({key:a+c, f1, f2, num:f1[0]*f2[0], den:f1[1]*f2[1]}); }
  return out;
 },
 upd(){
  const S = this, N = S.r + S.b; setSl('k1r', S.r, 0); setSl('k1b', S.b, 0); setSeg('k1K', K1P.findIndex(q => q.r === S.r && q.b === S.b && q.mode === S.mode && q.ev === S.ev));
  $('k1wrongW').hidden = S.mode === 1;
  $('k1task').innerHTML = taskHTML('k1task', `In einer Urne liegen <b class="ca">${S.r} rote</b> und <b class="cb">${S.b} blaue</b> Kugeln. Zwei Kugeln werden nacheinander zufällig <b>${S.mode === 0 ? 'ohne' : 'mit'} Zurücklegen</b> gezogen. Berechne die Wahrscheinlichkeit für „${EVN[S.ev]}“.`);
  const P = S.paths(S.wrong && S.mode === 0), sel = EV1[S.ev], den = P[0].den;
  const onKeys = S.lit == null ? sel : sel.slice(0, S.lit);
  S.draw(P, onKeys);
  const selP = sel.map(k => P.find(x => x.key === k)), tot = sum(selP.map(q => q.num));
  const L = [];
  L.push(`<span class="m">1. Pfadregel (multiplizieren):</span> P(Pfad) = P(1. Zug) · P(2. Zug)`);
  selP.forEach(q => L.push(`P(${q.key}) = P(${q.key[0]}) · P(${q.key[1]} nach ${q.key[0]}) = ${q.f1[0]}/${q.f1[1]} · ${q.f2[0]}/${q.f2[1]} = ${q.num}/${q.den}${frac(q.num,q.den) !== q.num+'/'+q.den ? ' = ' + frac(q.num,q.den) : ''}`));
  if (selP.length > 1) L.push(`<span class="m">2. Pfadregel (addieren):</span> P(E) = P(Pfad₁) + P(Pfad₂) + … → P(${EVN[S.ev]}) = ${selP.map(q => 'P(' + q.key + ')').join(' + ')} = ${selP.map(q => frac(q.num,q.den)).join(' + ')} = <b>${frac(tot,den)}</b> ≈ ${fmt(tot/den,3)}`);
  else L.push(`P(${EVN[S.ev]}) = P(${selP[0].key}) = <b>${frac(tot,den)}</b> ≈ ${fmt(tot/den,3)}`);
  if (S.ev === 2) { const bb = P[3]; L.push(`<span class="m">Gegenereignis:</span> P(E) = 1 − P(Ē) → P(mindestens eine rote) = 1 − P(BB) = 1 − ${frac(bb.num,den)} = ${frac(den-bb.num,den)}`); }
  // Bernoulli-Sicht: der Baum mit Zurücklegen ist eine Bernoulli-Kette mit n = 2 und p = r/N
  const pr = S.r / N, kmap = {0:[2], 1:[1], 3:[0,2], 4:[0]}, bern = k => choose(2,k) * Math.pow(pr,k) * Math.pow(1-pr,2-k);
  if (S.mode === 1) {
    const ks = kmap[S.ev], bval = S.ev === 2 ? 1 - bern(0) : sum(ks.map(bern));
    L.push(`<span class="m">Warum Bernoulli?</span> Jeder Zug ist derselbe Versuch mit zwei Ausgängen: rot = Treffer mit p = ${S.r}/${N} = ${fmt(pr,3)}, blau = Niete mit 1 − p = ${S.b}/${N}. Die Züge sind unabhängig, n = 2 ist fest ⇒ der Baum ist eine Bernoulli-Kette, X = Anzahl rote Kugeln.`);
    L.push(`<span class="m">Im Baum:</span> Jeder Pfad mit k roten Kugeln hat denselben Wert p<sup>k</sup> · (1 − p)<sup>2−k</sup>. Die 2. Pfadregel addiert so viele dieser gleichen Werte, wie es Pfade mit k roten gibt – diese Anzahl ist (2 über k). Anzahl × Pfadwert = Bernoulli-Formel.`);
    L.push(`<span class="m">Verallgemeinerung:</span> P(X = k) = (n über k) · p<sup>k</sup> · (1 − p)<sup>n−k</sup>. Für n = 2 kann man den Baum zeichnen, für n = 18 (Klausur, Aufgabe 5) hat er 262 144 Pfade – die Formel zählt sie, ohne zu zeichnen.`);
    if (S.ev === 2) L.push(`<span class="m">Bernoulli-Rechnung:</span> P(mindestens eine rote) = 1 − P(X = 0) = 1 − (2 über 0) · ${fmt(pr,3)}⁰ · ${fmt(1-pr,3)}² = 1 − ${fix(bern(0),4)} = <b>${fix(bval,4)}</b>`);
    else L.push(`<span class="m">Bernoulli-Rechnung:</span> P(${EVN[S.ev]}) = ${ks.map(k => `(2 über ${k}) · ${fmt(pr,3)}${sup(k)} · ${fmt(1-pr,3)}${sup(2-k)}`).join(' + ')} = ${ks.map(k => `${choose(2,k)} · ${fix(Math.pow(pr,k)*Math.pow(1-pr,2-k),4)}`).join(' + ')} = <b>${fix(bval,4)}</b>`);
    L.push(cond('Bernoulli-Kette: n fest · Treffer/Niete · p in jedem Zug gleich · unabhängig – mit Zurücklegen erfüllt', true));
    L.push(cond(`Pfadregeln und Bernoulli-Formel liefern denselben Wert: ${frac(tot,den)} = ${fix(tot/den,4)} = ${fix(bval,4)}`, Math.abs(tot/den - bval) < 1e-6, 'Kontrolle'));

scene('k2', {card:'2', title:'Zufallsgröße & Erwartungswert', grp:'Grundlagen', hint:'Rote Linie: E(X) · orange Klammer: μ ± σ',

 init(){ const S = this; S.g = 0; S.e = 3; S.step = 1; S.fair = false;

 },

  if (S.step >= 2) { svg.append(el('line', {x1:x(mu), x2:x(mu), y1:Tp-14, y2:B, class:'mu'})); svg.append(T(x(mu), Tp-26, `E(X) = ${fmt(mu,2)} €`, 't b ch')); }
  if (S.step >= 3) { const yb = Tp+4; svg.append(el('line', {x1:x(mu-sd), x2:x(mu+sd), y1:yb, y2:yb, class:'bnd'})); [mu-sd, mu+sd].forEach(v => svg.append(el('line', {x1:x(v), x2:x(v), y1:yb-6, y2:yb+6, class:'bnd'}))); svg.append(T(x(mu+sd)+8, yb, `σ = ${fmt(sd,2)} €`, 't mono ca', 'start', 12)); }

  UI.sl('k3n','n = Anzahl der Versuche',1,5,1,3) + UI.sl('k3p','p = Trefferwahrscheinlichkeit',0.05,0.95,0.05,0.5) + UI.sl('k3k','k = Anzahl der Treffer',0,3,1,2) +
  UI.chk('k3wrong','Fehlerweg: Binomialkoeffizient vergessen (nur einen Pfad zählen)') +
  `<div class="row">${UI.btn('k3play','Pfade mit k Treffern abzählen')}</div>` +
  `<div class="eq col" id="k3eq"></div>` + UI.st('k3st') + UI.leg([['--va','Treffer'],['--line','Niete']]),
 init(){ const S = this; S.n = 3; S.p = 0.5; S.k = 2; S.wrong = false; S.lit = null;
  onSl('k3n', v => { S.n = v; $('k3k').max = v; if (S.k > v) S.k = v; S.lit = null; S.upd(); });
  onSeg('k3K', i => S.preset(K3P[i])); $('k3KR').addEventListener('click', () => { const n = 2 + rnd(4); S.preset({n, p:[0.25,0.3,0.4,0.5,0.6,0.75][rnd(6)], k:rnd(n+1)}); });
  onSl('k3p', v => { S.p = v; S.lit = null; S.upd(); }); onSl('k3k', v => { S.k = v; S.lit = null; S.upd(); });
  $('k3wrong').addEventListener('change', e => { S.wrong = e.target.checked; S.upd(); });
  $('k3play').addEventListener('click', () => S.play());
 },
 show(){ this.lit = null; this.upd(); },
 upd(){
  const S = this, {n,p,k} = S, q = 1-p; setSl('k3n', n, 0); setSl('k3p', p, 2); setSl('k3k', k, 0); setSeg('k3K', K3P.findIndex(o => o.n === n && Math.abs(o.p - p) < 1e-9 && o.k === k));
  $('k3task').innerHTML = taskHTML('k3task', `X zählt die Treffer einer Bernoulli-Kette mit n = ${n} und p = ${fmt(p,2)}. Berechne den Binomialkoeffizienten für genau ${k} Treffer, P(X = ${k}) mit der Bernoulli-Formel und P(X ≤ ${k}) als Summe von Einzelwahrscheinlichkeiten.`);
  const arr = binom(n,p), c = cdf(arr), C = choose(n,k), one = Math.pow(p,k) * Math.pow(q,n-k);
  S.draw(arr, c);
  lines('k3eq', [
   `<span class="m">Binomialkoeffizient:</span> (n über k) = n! / (k! · (n − k)!) → (${n} über ${k}) = ${n}! / (${k}! · ${n-k}!) = ${fact(n)} / (${fact(k)} · ${fact(n-k)}) = <b>${C}</b>`,
   `<span class="m">Ein Pfad mit k Treffern:</span> p<sup>k</sup> · (1 − p)<sup>n−k</sup> = ${fmt(p,2)}${sup(k)} · ${fmt(q,2)}${sup(n-k)} = ${fix(one,4)}`,
   `<span class="m">Bernoulli-Formel:</span> P(X = k) = (n über k) · p<sup>k</sup> · (1 − p)<sup>n−k</sup> → P(X = ${k}) = ${C} · ${fix(one,4)} = <b>${fix(arr[k],4)}</b>`,
   `<span class="m">Summe:</span> P(X ≤ k) = P(X = 0) + P(X = 1) + … + P(X = k) → P(X ≤ ${k}) = ${range(0,k).map(i => `P(X = ${i})`).join(' + ')} = ${range(0,k).map(i => fix(arr[i],4)).join(' + ')} = <b>${fix(cF(c,k),4)}</b>`,
   `<span class="m">F-Schreibweise:</span> P(X = ${k}) = ${Bs(n,p)}(${k}) ; P(X ≤ ${k}) = ${Fs(n,p)}(${k}) = ${fix(cF(c,k),4)}`,
   cond('Bernoulli-Kette ⇔ n fest · nur Treffer/Niete · p in jedem Versuch gleich · Versuche unabhängig'),
   cond(`Σ P(X = k) über alle k = ${range(0,n).map(i => fix(arr[i],4)).join(' + ')} = ${fix(sum(arr),4)}`, Math.abs(sum(arr)-1) < 1e-6, 'Kontrolle')
  ]);
  if (S.wrong) stat('k3st', `<b>Fehlerweg.</b> Ohne den Binomialkoeffizienten zählst du nur <em>einen</em> der ${C} Pfade mit ${k} Treffern: ${fix(one,4)} statt ${C} · ${fix(one,4)} = ${fix(arr[k],4)}. Jeder Pfad in der Spalte ist gleich wahrscheinlich, deshalb wird mit der Anzahl der Pfade multipliziert.`, 'bad');
  else stat('k3st', `Es gibt <b>${C}</b> Pfade mit genau ${k} Treffern (Spalte k = ${k}). Jeder hat die Wahrscheinlichkeit p${sup(k)} · (1 − p)${sup(n-k)}. Anzahl mal Pfadwert ergibt P(X = ${k}).`, 'ok');
 },
 draw(arr, c){
  clear(); const S = this, {n,k,p} = S, q = 1-p, C = choose(n,k), one = Math.pow(p,k) * Math.pow(q,n-k);
  const L = 90, R = 780, T0 = 58, B0 = 498, H = B0 - T0, dx = (R-L)/n;
  const y = (d,i) => T0 + (i + 0.5) * H / Math.pow(2,d);
  // Blattindex: Bit = 0 heißt Treffer (nach oben), Bit = 1 heißt Niete (nach unten), höchstes Bit = 1. Stufe
  const hits = idx => { let h = 0; for (let s = 0; s < n; s++) if (((idx >> (n-1-s)) & 1) === 0) h++; return h; };
  const seq = idx => range(0,n-1).map(s => ((idx >> (n-1-s)) & 1) === 0 ? 'T' : 'N').join('');
  const leaves = range(0, (1 << n) - 1), selIdx = leaves.filter(i => hits(i) === k);
  const lit = new Set(S.lit == null ? selIdx : selIdx.slice(0, S.lit));
  const litUnder = (d,i) => { const span = 1 << (n-d), from = i*span; for (let j = from; j < from+span; j++) if (lit.has(j)) return true; return false; };
  svg.append(T(450, 26, `Jede Stufe: Treffer ↑ mit p = ${fmt(p,2)} (orange), Niete ↓ mit 1 − p = ${fmt(q,2)} (grau) · ${1 << n} Pfade · leuchtend: genau ${k} Treffer`, 't m', 'middle', 13));
  for (let d = 0; d < n; d++) for (let i = 0; i < (1 << d); i++) {
    const x1 = L + d*dx, x2 = L + (d+1)*dx, y1 = y(d,i);
    [[2*i,'T'],[2*i+1,'N']].forEach(([ci,t]) => { const on = litUnder(d+1, ci), y2 = y(d+1,ci);
      svg.append(el('line', {x1, y1, x2, y2, class:'edge' + (on ? (t === 'T' ? ' on' : '') : ' dim'), style: on && t === 'N' ? 'stroke-width:3.5' : ''}));
      if (d < 2) svg.append(T((x1+x2)/2, (y1+y2)/2 + (t === 'T' ? -9 : 11), t === 'T' ? fmt(p,2) : fmt(q,2), 't mono' + (on ? ' b' : ' m'), 'middle', 12)); });
  }
  const rN = Math.max(3, Math.min(9, H / Math.pow(2,n) * 0.32));
  svg.append(el('circle', {cx:L, cy:y(0,0), r:9, class:'nd root'})); svg.append(T(L, y(0,0) - 18, 'Start', 't m', 'middle', 12));
  for (let d = 1; d <= n; d++) for (let i = 0; i < (1 << d); i++) { const t = (i & 1) === 0 ? 'T' : 'N', on = litUnder(d, i);
    svg.append(el('circle', {cx:L + d*dx, cy:y(d,i), r:rN, class: t === 'T' ? 'nd R' : 'nd', style: t === 'T' ? (on ? '' : 'opacity:.35') : `fill:var(--line);${on ? '' : 'opacity:.35'}`})); }
  const fs = n <= 3 ? 13 : n === 4 ? 11 : 9;
  leaves.forEach(i => { const on = lit.has(i), sel = hits(i) === k; svg.append(T(R + 12, y(n,i) + 1, seq(i) + (n <= 3 ? ` = ${fix(Math.pow(p,hits(i)) * Math.pow(q,n-hits(i)),4)}` : ''), 't mono' + (on ? ' b ca' : sel ? ' m' : ' m'), 'start', fs)); });
  const cnt = S.lit == null ? C : Math.min(S.lit, C);
  svg.append(T(450, 522, `${cnt} von ${C} Pfaden mit genau ${k} Treffern gezählt → Binomialkoeffizient (${n} über ${k}) = ${C}`, 't b', 'middle', 14));
  svg.append(T(450, 544, `Jeder dieser Pfade: p${sup(k)} · (1 − p)${sup(n-k)} = ${fmt(p,2)}${sup(k)} · ${fmt(q,2)}${sup(n-k)} = ${fix(one,4)}  ⇒  P(X = ${k}) = ${C} · ${fix(one,4)} = ${fix(arr[k],4)}`, 't mono', 'middle', 13));
 },
 play(){ const S = this; stopAll(); S.lit = 0; S.upd(); const C = choose(S.n, S.k); for (let i = 1; i <= C; i++) later(Math.max(250, 900 - 60*C)*i, () => { S.lit = i; S.upd(); }); }
});

scene('k4', {card:'4', title:'Diagramm & Tabelle ablesen', grp:'Binomialverteilung', hint:'Säule antippen wählt k',
 html: UI.q('Wie lese ich P(X &lt; k), P(X = k) und P(X &gt; k) aus einem Säulendiagramm oder einer Tabelle ab?') +
  klausurUI('k4K') + `<div class="task" id="k4task"></div>` +
  UI.seg('k4v', ['Einzelwahrscheinlichkeiten P(X = k)','Kumuliert P(X ≤ k)']) +
  UI.sl('k4n','n',1,30,1,8) + UI.sl('k4p','p',0.05,0.95,0.05,0.6) + UI.sl('k4k','k',0,8,1,4) +
  `<div class="eq col" id="k4eq"></div>` +
  `<div id="k4tw"><div class="lbl">Tabelle (Einzel- und kumulierte Wahrscheinlichkeiten)</div><div class="tscroll"><table class="dist" id="k4tab"></table></div></div>` +
  UI.st('k4st') + UI.leg([['--vb','X &lt; k'],['--va','X = k'],['--vr','X &gt; k']]),
 init(){ const S = this; S.v = 0; S.n = 8; S.p = 0.6; S.k = 4;
  onSeg('k4v', v => { S.v = v; S.upd(); });
  onSeg('k4K', i => S.preset(K4P[i])); $('k4KR').addEventListener('click', () => { const n = 4 + rnd(17); S.preset({n, p:(2 + rnd(16)) * 0.05, k:rnd(n+1)}); });
  onSl('k4n', v => { S.n = v; $('k4k').max = v; if (S.k > v) S.k = v; S.upd(); }); onSl('k4p', v => { S.p = v; S.upd(); }); onSl('k4k', v => { S.k = v; S.upd(); });
 },
 show(){ this.upd(); },
 pick(k){ stopAll(); this.k = k; this.upd(); },
 upd(){
  const S = this, {n,p,k} = S; setSl('k4n', n, 0); setSl('k4p', p, 2); setSl('k4k', k, 0); setSeg('k4K', K4P.findIndex(o => o.n === n && Math.abs(o.p - p) < 1e-9 && o.k === k));
  const arr = binom(n,p), c = cdf(arr), lt = cF(c,k-1), eq = arr[k], gt = 1 - cF(c,k);
  $('k4task').innerHTML = taskHTML('k4task', `X ist binomialverteilt mit n = ${n} und p = ${fmt(p,2)}. Jede Säule zeigt ${S.v === 0 ? 'P(X = k)' : 'P(X ≤ k)'}. Lies P(X &lt; ${k}), P(X = ${k}) und P(X &gt; ${k}) näherungsweise ab und gib für jeden Wert den passenden F-Ausdruck an.`);
  clear();
  if (S.v === 0) { const H = hist({n, arr, pick:true, cls: j => j < k ? 'lt' : j === k ? 'on' : 'gt'});
    if (n <= 14) for (let j = 0; j <= n; j++) if (arr[j] > 0.004) svg.append(T(H.x(j), H.y(arr[j])-10, fix(arr[j],3), 't mono m', 'middle', 10));
    // Klammern unter der Achse für die drei Gruppen
    if (k > 0) bracket(H.x(0)-H.w*0.4, H.x(k-1)+H.w*0.4, PL.B+28, `X < ${k}: ${fix(lt,4)}`, '--vb');
    bracket(H.x(k)-H.w*0.4, H.x(k)+H.w*0.4, PL.B+28, `X = ${k}: ${fix(eq,4)}`, '--va', 36);
    if (k < n) bracket(H.x(k+1)-H.w*0.4, H.x(n)+H.w*0.4, PL.B+28, `X > ${k}: ${fix(gt,4)}`, '--vr');
  } else {
    const H = hist({n, arr:c, ymax:1, ylabel:'P(X ≤ k)', pick:true, cls: j => j === k ? 'on' : j === k-1 ? 'lt' : ''});
    // Hilfslinien auf Höhe F(k) und F(k−1); Beschriftung links, wo die Säulen niedriger sind
    [[cF(c,k), `F(${k}) = ${fix(cF(c,k),4)}`, -9], [cF(c,k-1), `F(${fmt(k-1,0)}) = ${fix(cF(c,k-1),4)}`, 11]].forEach(([v,l,dy]) => {
      svg.append(el('line', {x1:PL.L, x2:H.x(k)+H.w*0.5, y1:H.y(v), y2:H.y(v), class:'bnd'})); svg.append(T(PL.L+8, H.y(v)+dy, l, 't mono ca', 'start', 12)); });
    // Höhenunterschied zwischen Säule k−1 und k = P(X = k)
    const xk = H.x(k) - H.w*0.45, ym = (H.y(cF(c,k)) + H.y(cF(c,k-1))) / 2;
    svg.append(el('line', {x1:xk, x2:xk, y1:H.y(cF(c,k)), y2:H.y(cF(c,k-1)), style:'stroke:var(--va);stroke-width:3'}));
    svg.append(T(xk-6, ym, `Unterschied = P(X = ${k}) = ${fix(eq,4)}`, 't mono ca', 'end', 12));
    bracket(H.x(k)-H.w*0.4, H.x(k)+H.w*0.4, PL.B+28, `Säule ${k} = P(X ≤ ${k}) = F(${k})`, '--va');
  }
  svg.append(T(450, 20, `X ist binomialverteilt mit n = ${n} und p = ${fmt(p,2)} · ${S.v === 0 ? 'Einzelwahrscheinlichkeiten' : 'kumulierte Wahrscheinlichkeiten'}`, 't m', 'middle', 13));
  const F = Fs(n,p);
  lines('k4eq', [
   `<span class="m">Allgemein mit F(k) = P(X ≤ k):</span> P(X &lt; k) = F(k − 1) ; P(X = k) = F(k) − F(k − 1) ; P(X &gt; k) = 1 − F(k)`,
   `<span class="cb">P(X &lt; ${k})</span> = P(X ≤ ${fmt(k-1,0)}) = ${F}(${fmt(k-1,0)}) = <b>${fix(lt,4)}</b>`,
   `<span class="ca">P(X = ${k})</span> = ${F}(${k}) − ${F}(${fmt(k-1,0)}) = ${fix(cF(c,k),4)} − ${fix(lt,4)} = <b>${fix(eq,4)}</b>`,
   `<span class="cr">P(X &gt; ${k})</span> = 1 − ${F}(${k}) = 1 − ${fix(cF(c,k),4)} = <b>${fix(gt,4)}</b>`,
   cond(`F ist kumuliert: F(k) = P(X ≤ k) wächst von F(−1) = 0 bis F(${n}) = 1, nie fallend`),
   cond(`P(X &lt; k) + P(X = k) + P(X &gt; k) = 1: ${fix(lt,4)} + ${fix(eq,4)} + ${fix(gt,4)} = ${fix(lt+eq+gt,4)}`, Math.abs(lt+eq+gt-1) < 1e-6, 'Kontrolle')
  ]);
  if (n <= 15) { $('k4tw').hidden = false;
    $('k4tab').innerHTML = `<tr><th>k</th><th>P(X = k)</th><th>P(X ≤ k)</th></tr>` +
      range(0,n).map(j => `<tr class="${j===k?'h1':''}"><td>${j}</td><td>${fix(arr[j],4)}</td><td>${fix(c[j],4)}</td></tr>`).join('');
  } else $('k4tw').hidden = true;
  stat('k4st', S.v === 0
    ? `Im Diagramm der Einzelwahrscheinlichkeiten: P(X &lt; ${k}) ist die Summe der blauen Säulen links, P(X = ${k}) die orange Säule, P(X &gt; ${k}) die Summe der grünen Säulen rechts.`
    : `Im kumulierten Diagramm zeigt jede Säule P(X ≤ k). P(X = ${k}) ist der Höhenunterschied zwischen Säule ${k} und Säule ${fmt(k-1,0)}; P(X &gt; ${k}) ist der Rest von Säule ${k} bis 1.`);
 }
});

// Karte 5: Übersetzer „mindestens / höchstens / mehr als …“

const MODES = ['genau k','mindestens k','höchstens k','mehr als k','weniger als k','mindestens k, aber weniger als k₂'];
const evSet = (m,n,k,k2) => [[k,k],[k,n],[0,k],[k+1,n],[0,k-1],[k,k2-1]][m];
const wrongSet = (m,n,k,k2) => [[k,k],[k+1,n],[0,k-1],[k,n],[0,k],[k+1,k2]][m];
const evWords = (m,k,k2) => ['genau ' + k, 'mindestens ' + k, 'höchstens ' + k, 'mehr als ' + k, 'weniger als ' + k, `mindestens ${k}, aber weniger als ${k2}`][m];
// Übersetzung der Formulierung in eine Ungleichung (html: < und > maskiert)
const ineq = (m,k,k2,html) => { const lt = html ? '&lt;' : '<', gt = html ? '&gt;' : '>'; return [`X = ${k}`, `X ≥ ${k}`, `X ≤ ${k}`, `X ${gt} ${k}`, `X ${lt} ${k}`, `${k} ≤ X ${lt} ${k2}`][m]; };
function evF(m,k,k2,F){ const km = fmt(k-1,0); return [`${F}(${k}) − ${F}(${km})`, `1 − ${F}(${km})`, `${F}(${k})`, `1 − ${F}(${k})`, `${F}(${km})`, `${F}(${k2-1}) − ${F}(${km})`][m]; }
scene('k5', {card:'5', title:'Mindestens, höchstens, mehr als …', grp:'Binomialverteilung', hint:'Orange Säulen gehören zum Ereignis · Säule antippen wählt k',
 html: UI.q('Welche Trefferzahlen meint die Formulierung – und welcher F-Ausdruck passt dazu?') +
  klausurUI('k5K') + `<div class="task" id="k5task"></div>` +
  UI.sl('k5n','n',1,100,1,18) + UI.sl('k5p','p',0.01,0.99,0.01,0.62) + UI.sl('k5k','k',0,18,1,7) + `<div id="k5k2w">${UI.sl('k5k2','k₂',1,18,1,11)}</div>` +
  `<div><div class="lbl">Formulierung in der Aufgabe</div>${UI.seg('k5m', MODES)}</div>` +
  UI.chk('k5wrong','Fehlerweg: Grenze falsch – „mindestens“ wie „mehr als“ behandeln (und umgekehrt)') +
  `<div class="eq col" id="k5eq"></div>` +
  `<div><div class="lbl">Übersetzungstabelle (aktuelle Werte)</div><div class="tscroll"><table class="dist wrap1" id="k5tab"></table></div></div>` + UI.st('k5st') +
  `<p class="note"><b>Modellannahmen (Aufgabe 5a):</b> feste Anzahl n von Versuchen · jeder Versuch hat nur Treffer/Niete · gleiches p in jedem Versuch · Versuche unabhängig ⇒ X ist binomialverteilt.</p>`,
 init(){ const S = this; S.n = 18; S.p = 0.62; S.k = 7; S.k2 = 11; S.m = 0; S.wrong = false; S.pre = 0;
  onSeg('k5K', i => S.preset(Object.assign({pre:i}, K5P[i])));
  $('k5KR').addEventListener('click', () => { const n = 5 + rnd(36), k = rnd(n+1); S.preset({n, p:(5 + rnd(90)) / 100, k, k2:Math.min(n, k + 1 + rnd(5)), m:rnd(6), pre:-1}); });
  onSl('k5n', v => { S.n = v; S.k = Math.min(S.k, v); S.k2 = Math.min(S.k2, v); S.pre = -1; S.upd(); });
  onSl('k5p', v => { S.p = v; S.pre = -1; S.upd(); });
  onSl('k5k', v => { S.k = v; S.upd(); }); onSl('k5k2', v => { S.k2 = v; S.upd(); });
  onSeg('k5m', v => { S.m = v; S.upd(); });
  $('k5wrong').addEventListener('change', e => { S.wrong = e.target.checked; S.upd(); });
 },
 show(){ this.upd(); },
 pick(k){ stopAll(); this.k = k; this.upd(); },
 upd(){
  const S = this, {n,p,m} = S; $('k5k').max = n; $('k5k2').max = n; if (S.k2 <= S.k && m === 5) S.k2 = Math.min(n, S.k+1); $('k5k2').min = 1;
  const k = S.k, k2 = S.k2; setSl('k5n', n, 0); setSl('k5p', p, 2); setSl('k5k', k, 0); setSl('k5k2', k2, 0); $('k5k2w').hidden = m !== 5;
  const arr = binom(n,p), c = cdf(arr), [a,b] = evSet(m,n,k,k2), P = pRange(c,a,b);
  const aa = Math.max(0,a), bb = Math.min(n,b);
  setSeg('k5K', S.pre);
  const story = S.pre === 0 ? `Eine Spielerin führt ${n} unabhängige Würfe aus und trifft jeweils mit Wahrscheinlichkeit ${fmt(p,2)}. X zählt die Treffer.`
    : S.pre === 1 ? `Eine Maschine produziert ${n} Teile. Jedes Teil ist unabhängig mit Wahrscheinlichkeit ${fmt(p,2)} fehlerhaft. X zählt die fehlerhaften Teile, die hier als Treffer gelten.`
    : S.pre === 2 ? `Ein Online-Shop verschickt an einem Tag ${n} Pakete. Jedes Paket kommt unabhängig mit Wahrscheinlichkeit ${fmt(p,2)} beschädigt an. X zählt die beschädigten Pakete, die hier als Treffer gelten.`
    : S.pre === 3 ? `Eine Biathletin gibt ${n} Schüsse ab und trifft jeweils mit Wahrscheinlichkeit ${fmt(p,2)}. X zählt die Treffer.`
    : `X ist binomialverteilt mit n = ${n} und p = ${fmt(p,2)}.`;
  $('k5task').innerHTML = taskHTML('k5task', `${story} Bestimme die Wahrscheinlichkeit für „${evWords(m,k,k2)} Treffer“ (vier Dezimalstellen).`);
  clear();
  const H = hist({n, arr, pick:true, cls: j => (j >= a && j <= b) ? 'on' : 'dim'});
  const plain = aa > bb ? '0' : aa <= 0 ? `F(${bb})` : bb >= n ? `1 − F(${aa-1})` : `F(${bb}) − F(${aa-1})`;

const parseNum = s => parseFloat(String(s).replace(',','.'));
const showVal = v => typeof v === 'number' ? fmt(v, 2) : String(v);
const fracVal = s => { const [a,b] = String(s).split('/'); return b ? (+a)/(+b) : +a; };
function trainerCompute(frame, v){
  const L = []; let result = '', chips = [];
  if (frame === 'pfad') {
    const r = v.r, b = v.b, N = r + b, same = v.modus === 'mit Zurücklegen';
    const p1 = {R:[r,N], B:[b,N]}, p2 = a => same ? p1 : (a === 'R' ? {R:[r-1,N-1], B:[b,N-1]} : {R:[r,N-1], B:[b-1,N-1]});
    const keys = EVP[v.ev] || ['RR'], parts = keys.map(k => { const f1 = p1[k[0]], f2 = p2(k[0])[k[1]]; return {k, f1, f2, num:f1[0]*f2[0], den:f1[1]*f2[1]}; });
    const den = parts[0].den, tot = sum(parts.map(q => q.num));
    L.push(`<span class="m">Buchstaben:</span> ${FRAMES.pfad.f}`);
    parts.forEach(q => L.push(`P(${q.k}) = ${q.f1[0]}/${q.f1[1]} · ${q.f2[0]}/${q.f2[1]} = ${frac(q.num,q.den)}`));
    if (parts.length > 1) L.push(`P(${v.ev}) = ${parts.map(q => frac(q.num,q.den)).join(' + ')} = <b>${frac(tot,den)}</b> ≈ ${fmt(tot/den,3)}`);
    result = `P(${v.ev}) = ${frac(tot,den)} ≈ ${fmt(tot/den,3)}`;
    chips.push(cond(same ? 'mit Zurücklegen ⇒ Brüche in beiden Zügen gleich' : `ohne Zurücklegen ⇒ 2. Zug: Nenner ${N-1}`));
  } else if (frame === 'ex' || frame === 'fair') {
    const A = [v.a1, v.a2, v.a3], P = [v.p1, v.p2, v.p3], Pv = P.map(fracVal), e = frame === 'ex' ? v.e : null;
    if (frame === 'ex') { const mu = sum(A.map((a,i) => (a-e)*Pv[i]));
      L.push(`<span class="m">Buchstaben:</span> E(X) = Σ k · P(X = k) = (a₁ − e)·P₁ + (a₂ − e)·P₂ + (a₃ − e)·P₃`);
      L.push(`E(X) = ${A.map((a,i) => `(${a} − ${e})·${P[i]}`).join(' + ')} = ${A.map((a,i) => `${fmt(a-e)}·${P[i]}`).join(' + ')} = <b>${fmt(mu,3)} €</b>`);
      result = `E(X) = ${fmt(mu,2)} € → ${Math.abs(mu) < 1e-9 ? 'fair' : mu < 0 ? 'Nachteil Spielerin' : 'Vorteil Spielerin'}`;
      chips.push(cond(`Fair ⇔ E(X) = 0: hier ${fmt(mu,2)} € ${Math.abs(mu) < 1e-9 ? '= 0' : '≠ 0'}`, Math.abs(mu) < 1e-9 ? true : undefined, 'Fair?'), cond(`${P.join(' + ')} = 1`, Math.abs(sum(Pv)-1) < 1e-9, 'Kontrolle'));
    } else { const ea = sum(A.map((a,i) => a*Pv[i]));
      L.push(`<span class="m">Buchstaben:</span> Einsatz = E(Auszahlung) = a₁·P₁ + a₂·P₂ + a₃·P₃`);
      L.push(`Einsatz = ${A.map((a,i) => `${a}·${P[i]}`).join(' + ')} = <b>${fmt(ea,2)} €</b>`);
      result = `Fairer Einsatz = ${fmt(ea,2)} €`;
      chips.push(cond('Fair ⇔ E(X) = 0 ⇔ im Mittel genauso viel eingezahlt wie ausgezahlt'));
    }
  } else if (frame === 'bern') {
    const {n,p,k} = v, C = choose(n,k), one = Math.pow(p,k)*Math.pow(1-p,n-k);
    L.push(`<span class="m">Buchstaben:</span> ${FRAMES.bern.f}`);
    L.push(`P(X = ${k}) = (${n} über ${k}) · ${fmt(p,2)}${sup(k)} · ${fmt(1-p,2)}${sup(n-k)} = ${C} · ${fix(one,4)} = <b>${fix(C*one,4)}</b>`);
    result = `P(X = ${k}) = ${fix(C*one,4)}`;
    chips.push(cond('Bernoulli-Kette: n fest · Treffer/Niete · p gleich · unabhängig'));
  } else if (frame === 'bereich') {
    const {n,p} = v, a = +v.a, b = +v.b, c = cdf(binom(n,p)), P = pRange(c,a,b);
    L.push(`<span class="m">Buchstaben:</span> P(a ≤ X ≤ b) = F(b) − F(a − 1)`);
    L.push(`P(${a} ≤ X ≤ ${b}) = ${Fs(n,p)}(${b}) − ${Fs(n,p)}(${fmt(a-1,0)}) = ${fix(cF(c,b),4)} − ${fix(cF(c,a-1),4)} = <b>${fix(P,4)}</b>`);
    result = `P(${a} ≤ X ≤ ${b}) = ${fix(P,4)}`;
    chips.push(cond(`„${v.ev}“ ⇒ Grenzen a = ${a}, b = ${b}`, undefined, 'Grenze'));
  } else if (frame === 'sigma') {
    const {n,p} = v, z = +v.z, mu = n*p, sd = Math.sqrt(n*p*(1-p)), lo = mu-z*sd, hi = mu+z*sd, a = Math.max(0,Math.ceil(lo-1e-9)), b = Math.min(n,Math.floor(hi+1e-9)), c = cdf(binom(n,p)), P = pRange(c,a,b);
    L.push(`<span class="m">Buchstaben:</span> μ = n · p ; σ = √(n · p · (1 − p)) ; [μ − zσ ; μ + zσ]`);
    L.push(`μ = ${n} · ${fmt(p,2)} = ${fmt(mu,2)} ; σ = √(${n} · ${fmt(p,2)} · ${fmt(1-p,2)}) = √${fmt(n*p*(1-p),3)} ≈ ${fmt(sd,3)}`);
    L.push(`[${fmt(mu,2)} − ${z}·${fmt(sd,3)} ; ${fmt(mu,2)} + ${z}·${fmt(sd,3)}] = [${fmt(lo,2)} ; ${fmt(hi,2)}] → nach innen <b>${a} ≤ X ≤ ${b}</b> (P = ${pct(P,1)})`);
    result = `${a} ≤ X ≤ ${b}  (P ≈ ${pct(P,1)})`;
    chips.push(cond(`Laplace σ > 3: σ = ${fmt(sd,2)}`, sd > 3), cond('Grenzen mit ungerundetem σ, dann nach innen runden'));
  }
  return {L, result, chips};
}
scene('k9', {card:'9', title:'Zielformel zuerst', grp:'Training', hint:'Links die Zielformel mit Leerstellen, rechts die Aufgabe: Tippe die Elemente an, die die Leerstellen füllen',
 html: UI.q('Welche Zielformel passt – und welche Elemente im Text füllen ihre Leerstellen?') +
  `<div><div class="lbl">Aufgabe wählen</div>${UI.seg('k9t', TASKS.map(t => t.id))}<div class="row" style="margin-top:6px">${UI.btn('k9rand','Zufällige Aufgabe',true)}</div></div>` +
  `<div class="task" id="k9text"></div>` +
  `<div><div class="lbl">Schritt 1 · Zielformel (Rahmen) wählen</div><div class="frames" id="k9frames">${Object.entries(FRAMES).map(([k,f]) => `<button data-f="${k}"><b>${f.name}</b><span>${f.f}</span></button>`).join('')}</div></div>` +
  `<div id="k9s2" hidden><div class="lbl">Schritt 2 · Elemente im Text antippen, die die Leerstellen füllen</div><div class="slots" id="k9slots"></div><div class="seg" id="k9opts" style="margin-top:6px"></div></div>` +
  `<div id="k9s3" hidden><div class="lbl">Schritt 3 · Formel ausformulieren und rechnen</div><div class="eq col" id="k9eq"></div><div class="row" style="margin-top:8px">${UI.btn('k9go','Zur Karte mit diesen Werten')}${UI.btn('k9kw','Signalwörter zeigen',true)}</div></div>` +
  UI.st('k9st'),
 init(){ const S = this; S.t = 0; S.reset();
  onSeg('k9t', v => { S.t = v; S.reset(); S.upd(); });
  $('k9rand').addEventListener('click', () => { S.t = Math.floor(Math.random()*TASKS.length); setSeg('k9t', S.t); S.reset(); S.upd(); });
  $('k9frames').addEventListener('click', e => { const b = e.target.closest('button[data-f]'); if (!b || S.step !== 1) return; S.frameTry = b.dataset.f; if (b.dataset.f === S.task().frame) { S.frame = b.dataset.f; S.step = 2; } S.upd(); });
  $('k9text').addEventListener('click', e => { const b = e.target.closest('.tok'); if (!b || S.step !== 2) return; S.fill(b.dataset.t, b.dataset.t === 'num' ? parseNum(b.dataset.v) : b.dataset.v, b); });
  $('k9slots').addEventListener('click', e => { const b = e.target.closest('.slot'); if (!b || S.step !== 2) return; S.active = +b.dataset.i; S.upd(); });
  $('k9opts').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || S.step !== 2) return; S.fill('choice', b.dataset.v); });
  $('k9go').addEventListener('click', () => { const g = S.task().go; go(g.card); const sc = scenes[g.card]; if (sc.preset) sc.preset(g.set); });
  $('k9kw').addEventListener('click', () => { S.showKw = !S.showKw; S.upd(); });
 },
 task(){ return TASKS[this.t]; },
 reset(){ this.step = 1; this.frame = null; this.frameTry = null; this.vals = {}; this.state = {}; this.active = 0; this.showKw = false; this.wrongTok = null; },

 fill(kind, value, tokEl){ const S = this, T = S.task(), sl = T.slots[S.active]; if (!sl) return;
  const matchKind = (sl.kind === kind) || (sl.kind === 'choice' && kind === 'choice');
  if (!matchKind) { stat('k9st', `<b>Falscher Typ.</b> Die Leerstelle „${sl.label}“ braucht ${sl.kind === 'num' ? 'eine Zahl' : sl.kind === 'phrase' ? 'eine Formulierung aus dem Text' : 'eine Auswahl unten'}.`, 'bad'); return; }
  const ok = sl.kind === 'num' ? Math.abs(value - sl.ok) < 1e-9 : String(value) === String(sl.ok);
  S.vals[sl.id] = value; S.state[sl.id] = ok ? 'ok' : 'bad';
  if (ok) { stat('k9st', `<b>${sl.label} = ${showVal(value)}</b> ✓`, 'ok'); const next = T.slots.findIndex((s,i) => i > S.active && S.state[s.id] !== 'ok'); const any = T.slots.findIndex(s => S.state[s.id] !== 'ok'); S.active = next >= 0 ? next : any; if (T.slots.every(s => S.state[s.id] === 'ok')) S.step = 3; }
  else { stat('k9st', `<b>Nicht ${sl.label}.</b> ${sl.tip || 'Lies den Satz noch einmal: Welches Element bestimmt diese Leerstelle?'}`, 'bad'); S.wrongTok = tokEl || null; }
  S.upd();
 },
 upd(){ const S = this, T = S.task(), F = FRAMES[T.frame]; setSeg('k9t', S.t);
  // Aufgabentext mit antippbaren Elementen
  const used = new Set(Object.entries(S.vals).filter(([id,v]) => S.state[id] === 'ok').map(([id,v]) => String(v)));
  const plain = T.text.replace(/\{([^}]+)\}|\[([^\]]+)\]/g, (m,a,b) => a || b);
  $('k9text').innerHTML = S.showKw ? taskHTML('k9text', plain) : `<b>Aufgabe (${T.id.slice(0,1)} · ${T.id.slice(1)}):</b> <span class="ttext">` + T.text.replace(/\{([^}]+)\}|\[([^\]]+)\]/g, (m,a,b) => { const v = a || b, t = a ? 'num' : 'phrase', isUsed = used.has(String(t === 'num' ? parseNum(v) : v)); return `<button class="tok${isUsed ? ' used' : ''}" data-t="${t}" data-v="${v}">${v}</button>`; }) + `</span>`;
  // Schritt 1
  [...$('k9frames').children].forEach(b => { b.dataset.state = S.step >= 2 && b.dataset.f === T.frame ? 'ok' : (S.frameTry === b.dataset.f && S.frameTry !== T.frame) ? 'bad' : ''; b.disabled = S.step >= 2; });
  if (S.step === 1) { if (S.frameTry && S.frameTry !== T.frame) stat('k9st', `<b>Nicht ${FRAMES[S.frameTry].name}.</b> Die Stichwörter im Text (${F.why}) zeigen auf eine andere Zielformel.`, 'bad'); else stat('k9st', 'Zuerst den Rahmen festlegen: Welche Formel liefert am Ende die Antwort? Dann erst Zahlen suchen.'); }
  // Schritt 2
  $('k9s2').hidden = S.step < 2; $('k9s3').hidden = S.step < 3;

    $('k9slots').innerHTML = T.slots.map((sl,i) => `<button class="slot${S.state[sl.id] ? ' ' + S.state[sl.id] : ''}${i === S.active && S.step === 2 ? ' active' : ''}" data-i="${i}">${sl.label} = <i>${sl.id in S.vals ? showVal(S.vals[sl.id]) : '?'}</i></button>`).join('');
    const sl = T.slots[S.active]; $('k9opts').innerHTML = (S.step === 2 && sl && sl.kind === 'choice') ? `<span class="m" style="font-size:.8rem;align-self:center">${sl.label}:</span>` + sl.opts.map(o => `<button data-v="${o}">${o}</button>`).join('') : '';
    if (S.step === 2 && !S.state[sl && sl.id]) stat('k9st', sl.kind === 'choice' ? `Leerstelle „${sl.label}“: Wähle unten den passenden Wert.` : `Leerstelle „${sl.label}“: Tippe im Text ${sl.kind === 'num' ? 'die Zahl' : 'die Formulierung'} an, die sie bestimmt.`);
  }
  if (S.step === 3) { const R = trainerCompute(T.frame, S.vals); lines('k9eq', [...R.L, `<b>Ergebnis:</b> ${R.result}`, ...R.chips]); $('k9go').textContent = `Zur Karte ${F.card} mit diesen Werten`; stat('k9st', `<b>Alle Leerstellen gefüllt.</b> Rahmen: ${F.name}. Jetzt Formel mit Buchstaben, dann Zahlen einsetzen, dann Ergebnis mit Antwortsatz.`, 'ok'); }
  S.draw(T, F, S.step === 3 ? trainerCompute(T.frame, S.vals) : null);
 },
 draw(T, F, R){ clear(); const S = this;
  svg.append(T_(450, 30, S.step === 1 ? 'Schritt 1: Welche Zielformel ist der Rahmen?' : `Zielformel: ${F.name}`, 't b', 'middle', 18));
  if (S.step === 1) { Object.values(FRAMES).forEach((f,i) => { const y = 80 + i*74; svg.append(el('rect', {x:60, y:y-24, width:780, height:60, rx:10, class:'colbg'})); svg.append(T_(80, y-6, f.name, 't b', 'start', 15)); svg.append(T_(80, y+16, f.f, 't mono m', 'start', 13)); }); return; }
  svg.append(el('rect', {x:40, y:56, width:820, height:54, rx:10, class:'colbg'})); svg.append(T_(450, 83, F.f, 't mono b', 'middle', 19));
  // Leerstellen als Kästen
  const n = T.slots.length, bw = Math.min(150, (820 - (n-1)*10) / n), x0 = 450 - (n*bw + (n-1)*10)/2;
  T.slots.forEach((sl,i) => { const x = x0 + i*(bw+10), st = S.state[sl.id] || (i === S.active && S.step === 2 ? 'active' : '');
    svg.append(el('rect', {x, y:140, width:bw, height:70, rx:10, class:'fslot ' + st}));
    svg.append(T_(x+bw/2, 160, sl.label, 't m', 'middle', 12)); svg.append(T_(x+bw/2, 190, sl.id in S.vals ? showVal(S.vals[sl.id]) : '?', 't mono b', 'middle', 20, st === 'bad' ? '--hit' : st === 'ok' ? '--va' : undefined)); });
  svg.append(T_(450, 240, S.step === 2 ? 'Tippe im Aufgabentext die Elemente an, die diese Leerstellen bestimmen' : 'Alle Elemente gefunden – jetzt ausformulieren', 't m', 'middle', 13));
  if (R) { const txt = R.L.map(l => l.replace(/<sub>[^<]*<\/sub>/g,'').replace(/<[^>]+>/g,'')).slice(1); txt.forEach((l,i) => svg.append(T_(450, 290 + i*34, l.length > 95 ? l.slice(0,92) + '…' : l, 't mono', 'middle', 14)));
    svg.append(el('rect', {x:120, y:290 + txt.length*34 + 10, width:660, height:50, rx:10, class:'colbg'})); svg.append(T_(450, 290 + txt.length*34 + 36, R.result, 't b', 'middle', 18)); }
 }

const nav = $('nav'), panels = $('panels'), hint = $('hint'); let current = null;

  if (!groups[S.grp]) { const d = document.createElement('div'); d.className = 'grp'; d.innerHTML = `<div class="gl">${S.grp}</div>`; nav.appendChild(d); groups[S.grp] = d; }
